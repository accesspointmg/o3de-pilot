[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "o3de-pilot"
version = "0.1.0"
description = "AI-powered CLI for O3DE project management"
readme = "README.md"
license = {text = "Apache-2.0 OR MIT"}
requires-python = ">=3.10"
authors = [
    {name = "O3DE Foundation", email = "info@o3de.org"}
]
keywords = ["o3de", "game-engine", "cli", "ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "click>=8.3.2",
    "rich>=13.0",
    "httpx>=0.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",
]
ai = [
    "anthropic>=0.18",
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
all = ["o3de-pilot[gui,ai,dev]"]

[project.scripts]
o3de-pilot = "o3de_pilot.__main__:main"
o3de-pilot-gui = "o3de_pilot.gui.app:main"

[project.urls]
Homepage = "https://github.com/o3de/o3de-pilot"
Documentation = "https://github.com/o3de/o3de-pilot#readme"
Repository = "https://github.com/o3de/o3de-pilot.git"
Issues = "https://github.com/o3de/o3de-pilot/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
