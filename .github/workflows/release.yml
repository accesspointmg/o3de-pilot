# =============================================================================
# RELEASE WORKFLOW
# =============================================================================
# Manual only (Actions → Release → Run workflow), from the main branch.
#
#   1. Checks: running from main, version format, tag v<version> unused
#   2. Verify: the full ci.yml pipeline (lint → package → tests on Windows,
#      Ubuntu, Fedora and macOS) with <version> stamped into the package
#   3. Publish: tag v<version> on the tested commit and create a GitHub
#      Release with the wheel and sdist attached
#
# Nothing is published unless every check and test passes. Builds run on
# throwaway VMs, so the GitHub Release is the only place outputs are kept.
# =============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0, 1.1.0-beta.1, 2.0.0-rc.1'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release (automatic for -alpha/-beta/-rc versions)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time; never cancel one that's running.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: "Release checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check branch, version and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases can only be created from the main branch (this run is on $GITHUB_REF)"
            exit 1
          fi
          # Pre-release labels limited to ones Python packaging understands.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Use 1.2.3, 1.2.3-alpha.1, 1.2.3-beta.1 or 1.2.3-rc.1"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "✓ main, version $VERSION, tag v$VERSION is free"

  verify:
    name: "Verify"
    needs: [check]
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: "Publish GitHub Release"
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ls -l dist
          flags=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
                 --title "o3de-pilot v$VERSION" --generate-notes)
          if [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" "${flags[@]}" dist/*

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Released o3de-pilot v$VERSION"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
            echo ""
            echo "Install: \`pip install \"o3de-cli @ git+https://github.com/accesspointmg/o3de-cli\"\` then \`pip install <wheel URL from the release>\`"
          } >> "$GITHUB_STEP_SUMMARY"
