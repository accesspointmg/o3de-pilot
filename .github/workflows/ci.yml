# =============================================================================
# VERIFY WORKFLOW
# =============================================================================
# Triggered on ANY commit to ANY branch
# Pipeline: Request builders → Build all platforms (parallel when possible) → Release
#
# Runner Strategy:
#   - Coordinator: Always-on Proxmox VM that manages builder lifecycle
#   - macOS: Always-on Mac server (physical, not managed by coordinator)
#   - Windows/Linux: Started on-demand, stay running for reuse
#
# Smart Coordinator Pattern:
#   1. Coordinator queries Proxmox for available resources
#   2. Starts VMs only if resources available (or frees idle VMs)
#   3. VMs stay running after builds for immediate reuse
#   4. Only shuts down when resources needed elsewhere
#
# Key patterns:
#   - Single concurrency group (queue, don't cancel)
#   - Parallel platform builds when resources allow
#   - Artifacts saved to external drive, not GitHub artifacts (quota concerns)
#   - File path filters for efficiency
# =============================================================================

name: Verify Build

on:
  push:
    branches:
      - '**'  # All branches
    tags-ignore:
      - '**'  # Ignore tags
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild (ignore cache)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# All builds share one group on self-hosted runner - queue, don't run parallel
# This matches Northway-mobile pattern to prevent resource contention
concurrency:
  group: self-hosted-builds
  cancel-in-progress: false

env:
  # Local artifact storage on external drive (similar to Northway-mobile)
  ARTIFACT_DIR: /Volumes/4TBNVMEEXT/o3de-pilot-artifacts/verify/${{ github.sha }}

jobs:
  # ===========================================================================
  # STAGE 1: PRE-BUILD CHECKS (Lint, Type Check, Format)
  # ===========================================================================
  # Runs on self-hosted macOS runner
  # Must pass before any builds start
  
  validate:
    name: "Lint & Type Check"
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Check if Python CLI exists
        id: cli_check
        run: |
          if [ -f "src/cli/pyproject.toml" ]; then
            echo "cli_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Python CLI found"
          else
            echo "cli_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Python CLI not yet created - skipping Python checks"
          fi

      - name: Set up Python
        if: steps.cli_check.outputs.cli_exists == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/cli/pyproject.toml

      - name: Install dependencies
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: ruff check o3de_pilot/ || echo "⚠️ Lint issues found (non-blocking)"
        continue-on-error: true

      - name: Run Ruff formatter check
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: ruff format --check o3de_pilot/ || echo "⚠️ Format issues found (non-blocking)"
        continue-on-error: true

      - name: Run MyPy type checker
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: mypy o3de_pilot/ --ignore-missing-imports || echo "⚠️ Type errors found (non-blocking)"
        continue-on-error: true

      - name: Validate CMakeLists.txt exists
        run: |
          if [ -f "CMakeLists.txt" ]; then
            echo "✅ CMakeLists.txt found"
          else
            echo "⚠️ CMakeLists.txt not found - GUI build will be skipped"
          fi

  # ===========================================================================
  # REQUEST BUILDERS (Coordinator starts Windows/Linux VMs if needed)
  # ===========================================================================
  # Runs on always-on coordinator VM
  # Starts Proxmox VMs only if resources available
  # VMs stay running after builds for reuse
  
  request-builders:
    name: "Request Builders"
    needs: [validate]
    runs-on: [self-hosted, coordinator]
    steps:
      - name: Show current status
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py status

      - name: Request Windows builder
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py request windows --timeout 300

      - name: Request Ubuntu builder
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py request ubuntu --timeout 180

      - name: Show status after requests
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py status

  # ===========================================================================
  # STAGE 2: BUILD PLATFORMS (Sequential on self-hosted)
  # ===========================================================================
  # macOS build runs first (always-on), then Windows/Linux after coordinator starts them
  
  build-macos:
    name: "Build: macOS (arm64)"
    needs: [validate]
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        id: setup
        run: |
          # Add Homebrew and Cellar binaries to PATH
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          
          # Also check Cellar for unlinked packages
          if [ -d "/opt/homebrew/Cellar/cmake" ]; then
            CMAKE_PATH=$(ls -d /opt/homebrew/Cellar/cmake/*/bin 2>/dev/null | head -1)
            if [ -n "$CMAKE_PATH" ]; then
              export PATH="$CMAKE_PATH:$PATH"
            fi
          fi
          
          echo "PATH=$PATH" >> $GITHUB_ENV
          
          # Verify CMake is available
          if command -v cmake &> /dev/null; then
            echo "✅ CMake found: $(cmake --version | head -1)"
          else
            echo "❌ CMake not found. Please install it on the runner:"
            echo "   brew install cmake"
            exit 1
          fi
          
          # Check if CMakeLists.txt exists
          if [ -f "CMakeLists.txt" ]; then
            echo "cmake_exists=true" >> $GITHUB_OUTPUT
            echo "✅ CMakeLists.txt found"
          else
            echo "cmake_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ CMakeLists.txt not found - skipping C++ build"
          fi

      - name: Check for existing build
        id: cache
        if: steps.setup.outputs.cmake_exists == 'true' && github.event.inputs.force_rebuild != 'true'
        run: |
          echo "🔍 Checking for existing macOS build for ${{ github.sha }}..."
          if [ -f "${{ env.ARTIFACT_DIR }}/O3DEPilot.app.tar.gz" ]; then
            echo "✅ Found existing build - skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "📦 No existing build found, will build fresh"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure CMake
        if: steps.setup.outputs.cmake_exists == 'true' && steps.cache.outputs.exists != 'true'
        run: |
          # Build arm64 only - Homebrew Qt is arm64 only on Apple Silicon
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build
        if: steps.setup.outputs.cmake_exists == 'true' && steps.cache.outputs.exists != 'true'
        run: cmake --build build --config Release --parallel

      - name: Save to external drive
        if: steps.setup.outputs.cmake_exists == 'true' && steps.cache.outputs.exists != 'true'
        run: |
          mkdir -p "${{ env.ARTIFACT_DIR }}"
          if [ -d "build/src/gui/O3DEPilot.app" ]; then
            tar -czf "${{ env.ARTIFACT_DIR }}/O3DEPilot.app.tar.gz" -C build/src/gui O3DEPilot.app
            echo "✅ Saved to: ${{ env.ARTIFACT_DIR }}/O3DEPilot.app.tar.gz"
          else
            echo "⚠️ App bundle not found (Qt not configured?)"
          fi

      - name: Report cache hit
        if: steps.cache.outputs.exists == 'true'
        run: echo "✅ Build already exists for ${{ github.sha }}"
      
      - name: Report no build files
        if: steps.setup.outputs.cmake_exists != 'true'
        run: echo "⚠️ No CMakeLists.txt - C++ build skipped (project scaffolding only)"

  # ===========================================================================
  # Windows Build - Uses PowerShell (no bash on Windows)
  # ===========================================================================
  build-windows:
    name: "Build: Windows"
    needs: [validate, build-macos, request-builders]
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Check for CMakeLists.txt
        id: check
        shell: pwsh
        run: |
          if (Test-Path "CMakeLists.txt") {
            "cmake_exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "✅ CMakeLists.txt found"
          } else {
            "cmake_exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "⚠️ CMakeLists.txt not found - skipping build"
          }

      - name: Install Qt
        if: steps.check.outputs.cmake_exists == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Setup MSVC
        if: steps.check.outputs.cmake_exists == 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        shell: pwsh
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 2
          shell: pwsh
          command: cmake --build build --config Release

      - name: Save artifacts
        if: steps.check.outputs.cmake_exists == 'true'
        shell: pwsh
        run: |
          $artifactDir = "C:\o3de-pilot-artifacts\verify\${{ github.sha }}"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          if (Test-Path "build\src\gui\Release\O3DEPilot.exe") {
            Copy-Item "build\src\gui\Release\O3DEPilot.exe" $artifactDir
            Write-Host "✅ Saved to: $artifactDir"
          } else {
            Write-Host "⚠️ EXE not found"
          }

      - name: Report no build files
        if: steps.check.outputs.cmake_exists != 'true'
        shell: pwsh
        run: Write-Host "⚠️ No CMakeLists.txt - Windows build skipped"

  # ===========================================================================
  # Linux Build - Sequential after Windows
  # ===========================================================================
  build-linux:
    name: "Build: Linux"
    needs: [validate, build-windows, request-builders]
    runs-on: [self-hosted, ubuntu]
    steps:
      - uses: actions/checkout@v4

      - name: Check for CMakeLists.txt
        id: check
        run: |
          if [ -f "CMakeLists.txt" ]; then
            echo "cmake_exists=true" >> $GITHUB_OUTPUT
            echo "✅ CMakeLists.txt found"
          else
            echo "cmake_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ CMakeLists.txt not found - skipping build"
          fi

      - name: Install dependencies
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Install Qt
        if: steps.check.outputs.cmake_exists == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          cache: true

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: cmake --build build

      - name: Save artifacts
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          ARTIFACT_DIR="/opt/o3de-pilot-artifacts/verify/${{ github.sha }}"
          sudo mkdir -p "$ARTIFACT_DIR"
          sudo cp build/src/gui/O3DEPilot "$ARTIFACT_DIR/" 2>/dev/null || echo "⚠️ Binary not found"
          echo "✅ Saved to: $ARTIFACT_DIR"

      - name: Report no build files
        if: steps.check.outputs.cmake_exists != 'true'
        run: echo "⚠️ No CMakeLists.txt - Linux build skipped"

  # ===========================================================================
  # STAGE 3: POST-BUILD TESTS
  # ===========================================================================
  # Only runs after ALL platform builds succeed
  
  post-build-tests:
    name: "Post-Build: Python Tests"
    needs: [build-macos, build-windows, build-linux]
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Check if Python CLI exists
        id: cli_check
        run: |
          if [ -f "src/cli/pyproject.toml" ]; then
            echo "cli_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Python CLI found - running tests"
          else
            echo "cli_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Python CLI not yet created - skipping tests"
          fi

      - name: Set up Python
        if: steps.cli_check.outputs.cli_exists == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/cli/pyproject.toml

      - name: Install dependencies
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: pytest tests/ -v --tb=short || echo "⚠️ Tests failed (non-blocking for now)"
        continue-on-error: true

  # ===========================================================================
  # RELEASE BUILDERS (Mark as available, VMs stay running)
  # ===========================================================================
  
  release-builders:
    name: "Release Builders"
    runs-on: [self-hosted, coordinator]
    needs: [request-builders, build-windows, build-linux]
    if: always()
    steps:
      - name: Release Windows builder
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py release windows
        continue-on-error: true

      - name: Release Ubuntu builder
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py release ubuntu
        continue-on-error: true

      - name: Final status
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py status
          echo ""
          echo "✅ Builders released (VMs stay running for reuse)"

  # ===========================================================================
  # VERIFICATION COMPLETE
  # ===========================================================================
  
  verify-complete:
    name: "✓ Verification Complete"
    needs: [post-build-tests, release-builders]
    runs-on: [self-hosted, macOS]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Verify Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-build | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS Build | ${{ needs.post-build-tests.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows Build | ${{ needs.post-build-tests.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Build | ${{ needs.post-build-tests.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Post-build Tests | ${{ needs.post-build-tests.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Builder Release | ${{ needs.release-builders.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 VMs stay running for immediate reuse on next build" >> $GITHUB_STEP_SUMMARY
