# =============================================================================
# VERIFY WORKFLOW
# =============================================================================
# Triggered on push, pull_request, or manual dispatch.
#
# Runner Strategy:
#   auto (default): prefers self-hosted if coordinator + macos runners are
#     online, otherwise falls back to github-hosted automatically.
#
#   github-hosted:
#     macos-latest  |  windows-latest  |  ubuntu-latest
#     (Fedora has no GitHub-hosted runner — self-hosted only)
#
#   self-hosted:
#     macos-latest  |  windows-latest  |  ubuntu-latest  |  fedora-latest
#     Coordinator starts/stops Proxmox VMs on demand.
#
# Runner labels follow GitHub nomenclature:
#   -latest    = current version (alias managed at runner config level)
#   -<version> = pinned to a specific OS release (e.g., ubuntu-22.04)
# =============================================================================

name: Verify Build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      runner_env:
        description: 'Runner environment'
        type: choice
        options:
          - auto
          - github-hosted
          - self-hosted
        default: auto
      force_rebuild:
        description: 'Force rebuild (ignore cache)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  # Self-hosted: serialize to prevent resource contention on shared hardware
  # GitHub-hosted / auto: per-ref so branches/PRs run in parallel
  group: >-
    ${{
      (github.event.inputs.runner_env == 'self-hosted')
      && 'self-hosted-builds'
      || format('ci-{0}', github.ref)
    }}
  cancel-in-progress: ${{ github.event.inputs.runner_env != 'self-hosted' }}

jobs:
  # ===========================================================================
  # SETUP — determine runner labels for all subsequent jobs
  # ===========================================================================
  setup:
    name: Setup Runners
    runs-on: ubuntu-latest
    outputs:
      runner_macos: ${{ steps.set.outputs.runner_macos }}
      runner_windows: ${{ steps.set.outputs.runner_windows }}
      runner_ubuntu: ${{ steps.set.outputs.runner_ubuntu }}
      runner_fedora: ${{ steps.set.outputs.runner_fedora }}
      is_self_hosted: ${{ steps.set.outputs.is_self_hosted }}
    steps:
      - name: Determine runner labels
        id: set
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN || github.token }}
        run: |
          RUNNER_ENV="${{ github.event.inputs.runner_env || 'auto' }}"
          echo "Requested runner environment: $RUNNER_ENV"

          # Auto-detect: check if self-hosted runners are online
          # Uses RUNNER_CHECK_TOKEN (org PAT with self_hosted_runners:read)
          # Falls back to github-hosted if the token is missing or API fails
          if [ "$RUNNER_ENV" = "auto" ]; then
            RUNNERS=$(gh api orgs/${{ github.repository_owner }}/actions/runners --jq '[.runners[] | select(.status=="online") | .labels[].name] | unique' 2>/dev/null || echo '[]')
            echo "Online runner labels: $RUNNERS"

            HAS_COORDINATOR=$(echo "$RUNNERS" | grep -q '"coordinator"' && echo true || echo false)
            HAS_MACOS=$(echo "$RUNNERS" | grep -q '"macos-latest"' && echo true || echo false)

            if [ "$HAS_COORDINATOR" = "true" ] && [ "$HAS_MACOS" = "true" ]; then
              echo "Self-hosted runners available — using self-hosted"
              RUNNER_ENV="self-hosted"
            else
              echo "Self-hosted runners not available (coordinator=$HAS_COORDINATOR, macos=$HAS_MACOS) — falling back to github-hosted"
              RUNNER_ENV="github-hosted"
            fi
          fi

          echo "Resolved runner environment: $RUNNER_ENV"

          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            echo 'runner_macos=["self-hosted","macos-latest"]'     >> $GITHUB_OUTPUT
            echo 'runner_windows=["self-hosted","windows-latest"]' >> $GITHUB_OUTPUT
            echo 'runner_ubuntu=["self-hosted","ubuntu-latest"]'   >> $GITHUB_OUTPUT
            echo 'runner_fedora=["self-hosted","fedora-latest"]'   >> $GITHUB_OUTPUT
            echo 'is_self_hosted=true'                              >> $GITHUB_OUTPUT
          else
            echo 'runner_macos=["macos-latest"]'                    >> $GITHUB_OUTPUT
            echo 'runner_windows=["windows-latest"]'                >> $GITHUB_OUTPUT
            echo 'runner_ubuntu=["ubuntu-latest"]'                  >> $GITHUB_OUTPUT
            echo 'runner_fedora='                                    >> $GITHUB_OUTPUT
            echo 'is_self_hosted=false'                              >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # VALIDATE — lint, format, type check (always GitHub-hosted, platform-independent)
  # ===========================================================================
  validate:
    name: "Lint & Type Check"
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check if Python CLI exists
        id: cli_check
        run: |
          if [ -f "src/cli/pyproject.toml" ]; then
            echo "cli_exists=true" >> $GITHUB_OUTPUT
          else
            echo "cli_exists=false" >> $GITHUB_OUTPUT
            echo "Python CLI not yet created — skipping Python checks"
          fi

      - name: Set up Python
        if: steps.cli_check.outputs.cli_exists == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: ruff check o3de_pilot/
        continue-on-error: true

      - name: Ruff format
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: ruff format --check o3de_pilot/
        continue-on-error: true

      - name: MyPy
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: mypy o3de_pilot/ --ignore-missing-imports
        continue-on-error: true

  # ===========================================================================
  # REQUEST BUILDERS — self-hosted only (coordinator starts Proxmox VMs)
  # ===========================================================================
  request-builders:
    name: "Request Builders"
    needs: [setup]
    if: needs.setup.outputs.is_self_hosted == 'true'
    runs-on: [self-hosted, coordinator]
    steps:
      - name: Request all builders
        run: |
          cd ~/coordinator && source venv/bin/activate
          python coordinator.py status
          python coordinator.py request-all windows ubuntu fedora --timeout 300
          python coordinator.py status

  # ===========================================================================
  # BUILD: macOS
  # ===========================================================================
  build-macos:
    name: "Build: macOS (arm64)"
    needs: [setup, validate]
    runs-on: ${{ fromJSON(needs.setup.outputs.runner_macos) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          # Ensure Homebrew is in PATH (not always set for service-mode runners)
          eval "$(/opt/homebrew/bin/brew shellenv 2>/dev/null || /usr/local/bin/brew shellenv 2>/dev/null)" || true
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          which cmake || brew install cmake
          which ninja || brew install ninja
          cmake --version

      - name: Check for CMakeLists.txt
        id: check
        run: |
          if [ -f "CMakeLists.txt" ]; then
            echo "cmake_exists=true" >> $GITHUB_OUTPUT
          else
            echo "cmake_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Qt
        if: steps.check.outputs.cmake_exists == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          cache: ${{ needs.setup.outputs.is_self_hosted != 'true' }}

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        run: cmake --build build --config Release --parallel

      - name: Verify build output
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          if [ -d "build/src/gui/O3DEPilot.app" ]; then
            echo "macOS app bundle built successfully"
          else
            echo "App bundle not found (Qt not configured?)"
          fi

  # ===========================================================================
  # BUILD: Windows
  # ===========================================================================
  build-windows:
    name: "Build: Windows"
    needs: [setup, validate, request-builders]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.request-builders.result == 'success' || needs.request-builders.result == 'skipped')
    runs-on: ${{ fromJSON(needs.setup.outputs.runner_windows) }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for CMakeLists.txt
        id: check
        shell: cmd
        run: |
          if exist CMakeLists.txt (
            echo cmake_exists=true >> %GITHUB_OUTPUT%
          ) else (
            echo cmake_exists=false >> %GITHUB_OUTPUT%
          )

      - name: Install Qt
        if: steps.check.outputs.cmake_exists == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          arch: 'win64_msvc2019_64'
          cache: ${{ needs.setup.outputs.is_self_hosted != 'true' }}

      - name: Setup MSVC
        if: steps.check.outputs.cmake_exists == 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        shell: cmd
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          shell: cmd
          command: cmake --build build --config Release

      - name: Verify build output
        if: steps.check.outputs.cmake_exists == 'true'
        shell: cmd
        run: |
          if exist "build\src\gui\Release\O3DEPilot.exe" (
            echo Windows build succeeded
          ) else (
            echo EXE not found
          )

  # ===========================================================================
  # BUILD: Ubuntu
  # ===========================================================================
  build-ubuntu:
    name: "Build: Ubuntu"
    needs: [setup, validate, request-builders]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.request-builders.result == 'success' || needs.request-builders.result == 'skipped')
    runs-on: ${{ fromJSON(needs.setup.outputs.runner_ubuntu) }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for CMakeLists.txt
        id: check
        run: |
          [ -f "CMakeLists.txt" ] && echo "cmake_exists=true" >> $GITHUB_OUTPUT || echo "cmake_exists=false" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          # Kill unattended-upgrades if running (holds dpkg lock on fresh VMs)
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo pkill -9 -f unattended-upgr 2>/dev/null || true
          sleep 2
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock 2>/dev/null || true
          sudo dpkg --configure -a 2>/dev/null || true
          sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build || true
          cmake --version && ninja --version

      - name: Install Qt
        if: steps.check.outputs.cmake_exists == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          cache: ${{ needs.setup.outputs.is_self_hosted != 'true' }}

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: cmake --build build

      - name: Verify build output
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          [ -f "build/src/gui/O3DEPilot" ] && echo "Ubuntu build succeeded" || echo "Binary not found"

  # ===========================================================================
  # BUILD: Fedora (self-hosted only — no GitHub-hosted Fedora runner exists)
  # ===========================================================================
  build-fedora:
    name: "Build: Fedora"
    needs: [setup, validate, request-builders]
    if: |
      always() &&
      needs.setup.outputs.is_self_hosted == 'true' &&
      needs.validate.result == 'success' &&
      (needs.request-builders.result == 'success' || needs.request-builders.result == 'skipped')
    runs-on: ${{ fromJSON(needs.setup.outputs.runner_fedora) }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for CMakeLists.txt
        id: check
        run: |
          [ -f "CMakeLists.txt" ] && echo "cmake_exists=true" >> $GITHUB_OUTPUT || echo "cmake_exists=false" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          sudo dnf install -y gcc-c++ cmake ninja-build qt6-qtbase-devel python3-devel || true
          cmake --version
          ninja --version || echo "ninja not found, will use make"

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          if command -v ninja &> /dev/null; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: cmake --build build

      - name: Verify build output
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          [ -f "build/src/gui/O3DEPilot" ] && echo "Fedora build succeeded" || echo "Binary not found"

  # ===========================================================================
  # POST-BUILD TESTS
  # ===========================================================================
  post-build-tests:
    name: "Post-Build: Python Tests"
    needs: [setup, build-macos, build-windows, build-ubuntu, build-fedora]
    if: |
      always() &&
      needs.build-macos.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-ubuntu.result == 'success' &&
      (needs.build-fedora.result == 'success' || needs.build-fedora.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check if Python CLI exists
        id: cli_check
        run: |
          [ -f "src/cli/pyproject.toml" ] && echo "cli_exists=true" >> $GITHUB_OUTPUT || echo "cli_exists=false" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.cli_check.outputs.cli_exists == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install and test
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/ -v --tb=short
        continue-on-error: true

  # ===========================================================================
  # RELEASE BUILDERS — self-hosted only
  # ===========================================================================
  release-builders:
    name: "Release Builders"
    needs: [setup, request-builders, build-windows, build-ubuntu, build-fedora]
    if: always() && needs.setup.outputs.is_self_hosted == 'true'
    runs-on: [self-hosted, coordinator]
    steps:
      - name: Release all builders
        run: |
          cd ~/coordinator && source venv/bin/activate
          python coordinator.py release windows  || true
          python coordinator.py release ubuntu   || true
          python coordinator.py release fedora   || true
          python coordinator.py status

  # ===========================================================================
  # VERIFICATION COMPLETE
  # ===========================================================================
  verify-complete:
    name: "Verification Complete"
    needs: [setup, post-build-tests, release-builders]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Verify Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Runner env | \`${{ needs.setup.outputs.is_self_hosted == 'true' && 'self-hosted' || 'github-hosted' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
