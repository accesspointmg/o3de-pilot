# =============================================================================
# VERIFY WORKFLOW
# =============================================================================
# Triggered on ANY commit to ANY branch
# Pipeline: gate → lint → build all platforms in parallel → tests → summary
#
# Runner strategy (since 2026-10-29):
#   - Windows/Linux: a fresh, throwaway VM per job, created on demand by the
#     build-farm coordinator (GARM + Proxmox). `runs-on:` names the image, e.g.
#     `ubuntu24-amd64`, `fedora44-amd64`, `win11-amd64`. The VM is isolated
#     (internet only, no access to our network) and deleted after the job, so
#     nothing persists between runs: outputs go to GitHub artifacts.
#   - macOS: GitHub-hosted `macos-latest` until our own macOS VMs exist.
#   - gate / summary: GitHub-hosted `ubuntu-latest`.
# Available images: ubuntu24-amd64 ubuntu22-amd64 ubuntu26-amd64 debian13-amd64
#   fedora44-amd64 alma10-amd64 arch-amd64 opensuse-tw-amd64 win11-amd64
# =============================================================================

name: Verify Build

on:
  push:
    branches:
      - '**'  # All branches
    tags-ignore:
      - '**'  # Ignore tags
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # ===========================================================================
  # GATE: never run fork PRs on self-hosted runners
  # ===========================================================================
  # This repo is public. A pull request from a fork is code from anyone, and
  # the build jobs below run on our own machines. Fork PRs stop here. To build
  # one, a maintainer reviews it and pushes it to a branch in this repo.
  #
  # Defense in depth only: a fork PR can edit this file. The real control is the
  # org setting that requires maintainer approval before any outside
  # contributor's workflow runs — never approve a fork PR that changes .github/.
  gate:
    name: "Self-hosted gate"
    runs-on: ubuntu-latest
    steps:
      - name: Refuse fork pull requests
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::Pull requests from forks are not built on self-hosted runners. A maintainer will build this after review."
            exit 1
          fi
          echo "✓ Not a fork pull request"

  # ===========================================================================
  # STAGE 1: PRE-BUILD CHECKS (Lint, Type Check, Format)
  # ===========================================================================
  validate:
    name: "Lint & Type Check"
    needs: [gate]
    runs-on: ubuntu24-amd64
    steps:
      - uses: actions/checkout@v7

      - name: Check if Python CLI exists
        id: cli_check
        run: |
          if [ -f "src/cli/pyproject.toml" ]; then
            echo "cli_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Python CLI found"
          else
            echo "cli_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Python CLI not yet created - skipping Python checks"
          fi

      - name: Set up Python
        if: steps.cli_check.outputs.cli_exists == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: src/cli/pyproject.toml

      - name: Install dependencies
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: ruff check o3de_pilot/ || echo "⚠️ Lint issues found (non-blocking)"
        continue-on-error: true

      - name: Run Ruff formatter check
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: ruff format --check o3de_pilot/ || echo "⚠️ Format issues found (non-blocking)"
        continue-on-error: true

      - name: Run MyPy type checker
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: mypy o3de_pilot/ --ignore-missing-imports || echo "⚠️ Type errors found (non-blocking)"
        continue-on-error: true

      - name: Validate CMakeLists.txt exists
        run: |
          if [ -f "CMakeLists.txt" ]; then
            echo "✅ CMakeLists.txt found"
          else
            echo "⚠️ CMakeLists.txt not found - GUI build will be skipped"
          fi

  # ===========================================================================
  # STAGE 2: BUILD PLATFORMS (all in parallel)
  # ===========================================================================
  build-macos:
    name: "Build: macOS (arm64)"
    needs: [validate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for CMakeLists.txt
        id: setup
        run: |
          if [ -f "CMakeLists.txt" ]; then
            echo "cmake_exists=true" >> $GITHUB_OUTPUT
            echo "✅ CMakeLists.txt found"
          else
            echo "cmake_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ CMakeLists.txt not found - skipping C++ build"
          fi

      - name: Install Qt
        if: steps.setup.outputs.cmake_exists == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          cache: true

      - name: Configure CMake
        if: steps.setup.outputs.cmake_exists == 'true'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        if: steps.setup.outputs.cmake_exists == 'true'
        run: cmake --build build --config Release --parallel

      - name: Package app
        if: steps.setup.outputs.cmake_exists == 'true'
        run: |
          if [ -d "build/src/gui/O3DEPilot.app" ]; then
            tar -czf O3DEPilot.app.tar.gz -C build/src/gui O3DEPilot.app
          else
            echo "⚠️ App bundle not found (Qt not configured?)"
          fi

      - name: Upload artifact
        if: steps.setup.outputs.cmake_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: O3DEPilot-macos-arm64
          path: O3DEPilot.app.tar.gz
          retention-days: 14
          if-no-files-found: warn

      - name: Report no build files
        if: steps.setup.outputs.cmake_exists != 'true'
        run: echo "⚠️ No CMakeLists.txt - C++ build skipped (project scaffolding only)"

  build-windows:
    name: "Build: Windows"
    needs: [validate]
    runs-on: win11-amd64
    steps:
      - uses: actions/checkout@v7

      - name: Check for CMakeLists.txt
        id: check
        shell: cmd
        run: |
          if exist CMakeLists.txt (
            >>"%GITHUB_OUTPUT%" echo cmake_exists=true
            echo CMakeLists.txt found
          ) else (
            >>"%GITHUB_OUTPUT%" echo cmake_exists=false
            echo CMakeLists.txt not found - skipping build
          )

      # The Qt installer action needs Python; the Windows image doesn't ship it.
      - name: Set up Python
        if: steps.check.outputs.cmake_exists == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Qt
        if: steps.check.outputs.cmake_exists == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Setup MSVC
        if: steps.check.outputs.cmake_exists == 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        shell: cmd
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          shell: cmd
          command: cmake --build build --config Release

      - name: Upload artifact
        if: steps.check.outputs.cmake_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: O3DEPilot-windows-amd64
          path: build/src/gui/Release/O3DEPilot.exe
          retention-days: 14
          if-no-files-found: warn

      - name: Report no build files
        if: steps.check.outputs.cmake_exists != 'true'
        shell: cmd
        run: echo No CMakeLists.txt - Windows build skipped

  build-ubuntu:
    name: "Build: Ubuntu"
    needs: [validate]
    runs-on: ubuntu24-amd64
    steps:
      - uses: actions/checkout@v7

      - name: Check for CMakeLists.txt
        id: check
        run: |
          if [ -f "CMakeLists.txt" ]; then
            echo "cmake_exists=true" >> $GITHUB_OUTPUT
            echo "✅ CMakeLists.txt found"
          else
            echo "cmake_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ CMakeLists.txt not found - skipping build"
          fi

      - name: Install dependencies
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          # Compilers, cmake and ninja are in the image; these are Qt's build-time system libraries.
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libvulkan-dev
          cmake --version
          ninja --version

      # The system Python refuses pip installs (PEP 668); the Qt installer needs its own.
      - name: Set up Python
        if: steps.check.outputs.cmake_exists == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Qt
        if: steps.check.outputs.cmake_exists == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          cache: true

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: cmake --build build

      - name: Upload artifact
        if: steps.check.outputs.cmake_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: O3DEPilot-ubuntu24-amd64
          path: build/src/gui/O3DEPilot
          retention-days: 14
          if-no-files-found: warn

      - name: Report no build files
        if: steps.check.outputs.cmake_exists != 'true'
        run: echo "⚠️ No CMakeLists.txt - Ubuntu build skipped"

  build-fedora:
    name: "Build: Fedora"
    needs: [validate]
    runs-on: fedora44-amd64
    steps:
      - uses: actions/checkout@v7

      - name: Check for CMakeLists.txt
        id: check
        run: |
          if [ -f "CMakeLists.txt" ]; then
            echo "cmake_exists=true" >> $GITHUB_OUTPUT
            echo "✅ CMakeLists.txt found"
          else
            echo "cmake_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ CMakeLists.txt not found - skipping build"
          fi

      - name: Install dependencies
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          # Compilers, cmake and ninja are in the image; Qt and the Python headers (embedded interpreter) from Fedora.
          sudo dnf install -y qt6-qtbase-devel python3-devel
          cmake --version
          ninja --version

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: cmake --build build

      - name: Upload artifact
        if: steps.check.outputs.cmake_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: O3DEPilot-fedora44-amd64
          path: build/src/gui/O3DEPilot
          retention-days: 14
          if-no-files-found: warn

      - name: Report no build files
        if: steps.check.outputs.cmake_exists != 'true'
        run: echo "⚠️ No CMakeLists.txt - Fedora build skipped"

  # ===========================================================================
  # STAGE 3: POST-BUILD TESTS
  # ===========================================================================
  # Only runs after ALL platform builds succeed
  post-build-tests:
    name: "Post-Build: Python Tests"
    needs: [build-macos, build-windows, build-ubuntu, build-fedora]
    runs-on: ubuntu24-amd64
    steps:
      - uses: actions/checkout@v7

      - name: Check if Python CLI exists
        id: cli_check
        run: |
          if [ -f "src/cli/pyproject.toml" ]; then
            echo "cli_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Python CLI found - running tests"
          else
            echo "cli_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Python CLI not yet created - skipping tests"
          fi

      - name: Set up Python
        if: steps.cli_check.outputs.cli_exists == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: src/cli/pyproject.toml

      - name: Install dependencies
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: pytest tests/ -v --tb=short || echo "⚠️ Tests failed (non-blocking for now)"
        continue-on-error: true

  # ===========================================================================
  # VERIFICATION COMPLETE
  # ===========================================================================
  verify-complete:
    name: "✓ Verification Complete"
    needs: [gate, validate, build-macos, build-windows, build-ubuntu, build-fedora, post-build-tests]
    runs-on: ubuntu-latest
    if: always() && needs.gate.result == 'success'
    steps:
      - name: Check results
        run: |
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; *) echo "❌ ($1)";; esac; }
          {
            echo "## Verify Build Summary"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| Pre-build | $(icon ${{ needs.validate.result }}) |"
            echo "| macOS Build | $(icon ${{ needs.build-macos.result }}) |"
            echo "| Windows Build | $(icon ${{ needs.build-windows.result }}) |"
            echo "| Ubuntu Build | $(icon ${{ needs.build-ubuntu.result }}) |"
            echo "| Fedora Build | $(icon ${{ needs.build-fedora.result }}) |"
            echo "| Post-build Tests | $(icon ${{ needs.post-build-tests.result }}) |"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Build outputs: see this run's Artifacts (kept 14 days)."
          } >> $GITHUB_STEP_SUMMARY
