# =============================================================================
# VERIFY WORKFLOW
# =============================================================================
# Triggered on ANY commit to ANY branch (matching Northway-mobile pattern)
# Pipeline: Pre-build checks → Build all platforms (sequential) → Post-build tests
# Each stage must succeed before the next runs
#
# Runner Strategy:
#   - macOS: Always self-hosted (your Mac server)
#   - Windows: Self-hosted if available, otherwise GitHub-hosted (windows-latest)
#   - Linux: Self-hosted if available, otherwise GitHub-hosted (ubuntu-latest)
#
# To enable self-hosted Windows/Linux:
#   1. Set up runners with labels: [self-hosted, Windows] or [self-hosted, Linux]
#   2. Set repository variable: SELF_HOSTED_WINDOWS=true or SELF_HOSTED_LINUX=true
#      (Settings → Secrets and variables → Actions → Variables)
#
# Key patterns from Northway-mobile:
#   - Single concurrency group for self-hosted runner (queue, don't cancel)
#   - Sequential platform builds to avoid resource contention
#   - Artifacts saved to external drive, not GitHub artifacts (quota concerns)
#   - File path filters for efficiency
# =============================================================================

name: Verify Build

on:
  push:
    branches:
      - '**'  # All branches
    tags-ignore:
      - '**'  # Ignore tags
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild (ignore cache)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# All builds share one group on self-hosted runner - queue, don't run parallel
# This matches Northway-mobile pattern to prevent resource contention
concurrency:
  group: self-hosted-builds
  cancel-in-progress: false

env:
  # Local artifact storage on external drive (similar to Northway-mobile)
  ARTIFACT_DIR: /Volumes/4TBNVMEEXT/o3de-pilot-artifacts/verify/${{ github.sha }}

jobs:
  # ===========================================================================
  # STAGE 1: PRE-BUILD CHECKS (Lint, Type Check, Format)
  # ===========================================================================
  # Runs on self-hosted macOS runner
  # Must pass before any builds start
  
  validate:
    name: "Lint & Type Check"
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Check if Python CLI exists
        id: cli_check
        run: |
          if [ -f "src/cli/pyproject.toml" ]; then
            echo "cli_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Python CLI found"
          else
            echo "cli_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Python CLI not yet created - skipping Python checks"
          fi

      - name: Set up Python
        if: steps.cli_check.outputs.cli_exists == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/cli/pyproject.toml

      - name: Install dependencies
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: ruff check o3de_pilot/ || echo "⚠️ Lint issues found (non-blocking)"
        continue-on-error: true

      - name: Run Ruff formatter check
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: ruff format --check o3de_pilot/ || echo "⚠️ Format issues found (non-blocking)"
        continue-on-error: true

      - name: Run MyPy type checker
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: mypy o3de_pilot/ --ignore-missing-imports || echo "⚠️ Type errors found (non-blocking)"
        continue-on-error: true

      - name: Validate CMakeLists.txt exists
        run: |
          if [ -f "CMakeLists.txt" ]; then
            echo "✅ CMakeLists.txt found"
          else
            echo "⚠️ CMakeLists.txt not found - GUI build will be skipped"
          fi

  # ===========================================================================
  # STAGE 2: BUILD PLATFORMS (Sequential on self-hosted)
  # ===========================================================================
  # macOS build runs first, then others follow sequentially
  # This prevents resource contention on the self-hosted Mac runner
  
  build-macos:
    name: "Build: macOS (Universal)"
    needs: [validate]
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        id: setup
        run: |
          # Add Homebrew and Cellar binaries to PATH
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          
          # Also check Cellar for unlinked packages
          if [ -d "/opt/homebrew/Cellar/cmake" ]; then
            CMAKE_PATH=$(ls -d /opt/homebrew/Cellar/cmake/*/bin 2>/dev/null | head -1)
            if [ -n "$CMAKE_PATH" ]; then
              export PATH="$CMAKE_PATH:$PATH"
            fi
          fi
          
          echo "PATH=$PATH" >> $GITHUB_ENV
          
          # Verify CMake is available
          if command -v cmake &> /dev/null; then
            echo "✅ CMake found: $(cmake --version | head -1)"
          else
            echo "❌ CMake not found. Please install it on the runner:"
            echo "   brew install cmake"
            exit 1
          fi
          
          # Check if CMakeLists.txt exists
          if [ -f "CMakeLists.txt" ]; then
            echo "cmake_exists=true" >> $GITHUB_OUTPUT
            echo "✅ CMakeLists.txt found"
          else
            echo "cmake_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ CMakeLists.txt not found - skipping C++ build"
          fi

      - name: Check for existing build
        id: cache
        if: steps.setup.outputs.cmake_exists == 'true' && github.event.inputs.force_rebuild != 'true'
        run: |
          echo "🔍 Checking for existing macOS build for ${{ github.sha }}..."
          if [ -f "${{ env.ARTIFACT_DIR }}/O3DEPilot.app.tar.gz" ]; then
            echo "✅ Found existing build - skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "📦 No existing build found, will build fresh"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure CMake
        if: steps.setup.outputs.cmake_exists == 'true' && steps.cache.outputs.exists != 'true'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        if: steps.setup.outputs.cmake_exists == 'true' && steps.cache.outputs.exists != 'true'
        run: cmake --build build --config Release --parallel

      - name: Save to external drive
        if: steps.setup.outputs.cmake_exists == 'true' && steps.cache.outputs.exists != 'true'
        run: |
          mkdir -p "${{ env.ARTIFACT_DIR }}"
          if [ -d "build/src/gui/O3DEPilot.app" ]; then
            tar -czf "${{ env.ARTIFACT_DIR }}/O3DEPilot.app.tar.gz" -C build/src/gui O3DEPilot.app
            echo "✅ Saved to: ${{ env.ARTIFACT_DIR }}/O3DEPilot.app.tar.gz"
          else
            echo "⚠️ App bundle not found (Qt not configured?)"
          fi

      - name: Report cache hit
        if: steps.cache.outputs.exists == 'true'
        run: echo "✅ Build already exists for ${{ github.sha }}"
      
      - name: Report no build files
        if: steps.setup.outputs.cmake_exists != 'true'
        run: echo "⚠️ No CMakeLists.txt - C++ build skipped (project scaffolding only)"

  # ===========================================================================
  # Windows Build - Sequential after macOS
  # ===========================================================================
  # Uses self-hosted if SELF_HOSTED_WINDOWS=true, otherwise GitHub-hosted
  build-windows:
    name: "Build: Windows"
    needs: [validate, build-macos]
    runs-on: ${{ vars.SELF_HOSTED_WINDOWS == 'true' && fromJSON('["self-hosted", "Windows"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for CMakeLists.txt
        id: check
        shell: bash
        run: |
          if [ -f "CMakeLists.txt" ]; then
            echo "cmake_exists=true" >> $GITHUB_OUTPUT
            echo "✅ CMakeLists.txt found"
          else
            echo "cmake_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ CMakeLists.txt not found - skipping build"
          fi

      - name: Install Qt
        if: steps.check.outputs.cmake_exists == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Setup MSVC
        if: steps.check.outputs.cmake_exists == 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 30
          max_attempts: 2
          command: cmake --build build --config Release

      - name: Save artifacts (self-hosted)
        if: steps.check.outputs.cmake_exists == 'true' && vars.SELF_HOSTED_WINDOWS == 'true'
        shell: bash
        run: |
          # Self-hosted: save to network share or local path
          ARTIFACT_DIR="/c/o3de-pilot-artifacts/verify/${{ github.sha }}"
          mkdir -p "$ARTIFACT_DIR"
          cp -r build/src/gui/Release/O3DEPilot.exe "$ARTIFACT_DIR/" 2>/dev/null || echo "⚠️ EXE not found"
          echo "✅ Saved to: $ARTIFACT_DIR"

      - name: Upload artifacts (GitHub-hosted)
        if: steps.check.outputs.cmake_exists == 'true' && vars.SELF_HOSTED_WINDOWS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verify-windows
          path: build/src/gui/Release/O3DEPilot.exe
          if-no-files-found: warn
          retention-days: 3

      - name: Report no build files
        if: steps.check.outputs.cmake_exists != 'true'
        run: echo "⚠️ No CMakeLists.txt - Windows build skipped"

  # ===========================================================================
  # Linux Build - Sequential after Windows
  # ===========================================================================
  # Uses self-hosted if SELF_HOSTED_LINUX=true, otherwise GitHub-hosted
  build-linux:
    name: "Build: Linux"
    needs: [validate, build-windows]
    runs-on: ${{ vars.SELF_HOSTED_LINUX == 'true' && fromJSON('["self-hosted", "Linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for CMakeLists.txt
        id: check
        run: |
          if [ -f "CMakeLists.txt" ]; then
            echo "cmake_exists=true" >> $GITHUB_OUTPUT
            echo "✅ CMakeLists.txt found"
          else
            echo "cmake_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ CMakeLists.txt not found - skipping build"
          fi

      - name: Install dependencies
        if: steps.check.outputs.cmake_exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Install Qt
        if: steps.check.outputs.cmake_exists == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          cache: true

      - name: Configure CMake
        if: steps.check.outputs.cmake_exists == 'true'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        if: steps.check.outputs.cmake_exists == 'true'
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: cmake --build build

      - name: Save artifacts (self-hosted)
        if: steps.check.outputs.cmake_exists == 'true' && vars.SELF_HOSTED_LINUX == 'true'
        run: |
          # Self-hosted: save to local path
          ARTIFACT_DIR="/opt/o3de-pilot-artifacts/verify/${{ github.sha }}"
          sudo mkdir -p "$ARTIFACT_DIR"
          sudo cp build/src/gui/O3DEPilot "$ARTIFACT_DIR/" 2>/dev/null || echo "⚠️ Binary not found"
          echo "✅ Saved to: $ARTIFACT_DIR"

      - name: Upload artifacts (GitHub-hosted)
        if: steps.check.outputs.cmake_exists == 'true' && vars.SELF_HOSTED_LINUX != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verify-linux
          path: build/src/gui/O3DEPilot
          if-no-files-found: warn
          retention-days: 3

      - name: Report no build files
        if: steps.check.outputs.cmake_exists != 'true'
        run: echo "⚠️ No CMakeLists.txt - Linux build skipped"

  # ===========================================================================
  # STAGE 3: POST-BUILD TESTS
  # ===========================================================================
  # Only runs after ALL platform builds succeed
  
  post-build-tests:
    name: "Post-Build: Python Tests"
    needs: [build-macos, build-windows, build-linux]
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Check if Python CLI exists
        id: cli_check
        run: |
          if [ -f "src/cli/pyproject.toml" ]; then
            echo "cli_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Python CLI found - running tests"
          else
            echo "cli_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Python CLI not yet created - skipping tests"
          fi

      - name: Set up Python
        if: steps.cli_check.outputs.cli_exists == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/cli/pyproject.toml

      - name: Install dependencies
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        if: steps.cli_check.outputs.cli_exists == 'true'
        working-directory: src/cli
        run: pytest tests/ -v --tb=short || echo "⚠️ Tests failed (non-blocking for now)"
        continue-on-error: true

  # ===========================================================================
  # VERIFICATION COMPLETE
  # ===========================================================================
  
  verify-complete:
    name: "✓ Verification Complete"
    needs: [post-build-tests]
    runs-on: [self-hosted, macOS]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Verify Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-build | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS Build | ${{ needs.post-build-tests.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows Build | ${{ needs.post-build-tests.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Build | ${{ needs.post-build-tests.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Post-build Tests | ${{ needs.post-build-tests.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
