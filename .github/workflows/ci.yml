# =============================================================================
# VERIFY WORKFLOW
# =============================================================================
# Triggered on ANY commit to ANY branch
# Pipeline: Lint → Request builders → Build & test on every platform → Release builders
#
# O3DE Pilot is a Python (PySide6) GUI on top of o3de-cli (accesspointmg/o3de-cli,
# not on PyPI, so it is checked out next to this repo). Every platform installs both
# into a fresh venv and runs the test suite headless (QT_QPA_PLATFORM=offscreen);
# macOS also builds the wheel and sdist.
#
# Runner Strategy:
#   - Coordinator: Always-on Proxmox VM that manages builder lifecycle
#   - macOS: Always-on Mac server (physical, not managed by coordinator)
#   - Windows/Linux: Started on-demand, stay running for reuse
#
# Key patterns:
#   - Single concurrency group (queue, don't cancel)
#   - Results saved under $HOME/artifacts/github/<owner>/<repo>/verify/<sha> on each
#     runner, not GitHub artifacts (quota concerns)
#   - File path filters for efficiency
# =============================================================================

name: Verify Build

on:
  push:
    branches:
      - '**'  # All branches
    tags-ignore:
      - '**'  # Ignore tags
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# All builds share one group on self-hosted runner - queue, don't run parallel
# This matches Northway-mobile pattern to prevent resource contention
concurrency:
  group: self-hosted-builds
  cancel-in-progress: false

env:
  # Relative to the runner user's home ($HOME, or %USERPROFILE% on Windows)
  ARTIFACT_PATH: artifacts/github/${{ github.repository }}/verify/${{ github.sha }}
  PYTHON_VERSION: "3.13"
  O3DE_CLI_REF: development
  QT_QPA_PLATFORM: offscreen

jobs:
  # ===========================================================================
  # STAGE 1: PRE-BUILD CHECKS (Lint, Format)
  # ===========================================================================
  # Runs on self-hosted macOS runner
  # Must pass before any builds start

  validate:
    name: "Lint & Format Check"
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run Ruff linter
        run: ruff check src/gui tests || echo "⚠️ Lint issues found (non-blocking)"
        continue-on-error: true

      - name: Run Ruff formatter check
        run: ruff format --check src/gui tests || echo "⚠️ Format issues found (non-blocking)"
        continue-on-error: true

  # ===========================================================================
  # REQUEST BUILDERS (Coordinator starts Windows/Ubuntu VMs in parallel)
  # ===========================================================================
  # Runs on always-on coordinator VM
  # Boots all VMs simultaneously, waits for all runners in parallel
  # VMs stay running after builds for reuse

  request-builders:
    name: "Request Builders"
    needs: [validate]
    runs-on: [self-hosted, coordinator]
    steps:
      - name: Show current status
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py status

      - name: Request all builders in parallel
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py request-all windows ubuntu fedora --timeout 300

      - name: Show status after requests
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py status

  # ===========================================================================
  # STAGE 2: BUILD & TEST ON EVERY PLATFORM
  # ===========================================================================
  # macOS runs first (always-on), then Windows/Linux after coordinator starts them

  build-macos:
    name: "Build & Test: macOS (arm64)"
    needs: [validate]
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v7

      - name: Check out o3de-cli
        uses: actions/checkout@v7
        with:
          repository: accesspointmg/o3de-cli
          ref: ${{ env.O3DE_CLI_REF }}
          path: .deps/o3de-cli

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip build
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e .deps/o3de-cli -e "src/gui[dev]"

      - name: Test
        run: |
          mkdir -p "$HOME/${{ env.ARTIFACT_PATH }}"
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests -v --tb=short \
            --junitxml "$HOME/${{ env.ARTIFACT_PATH }}/pytest-macos.xml"

      - name: Build package
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m build src/gui --outdir "$HOME/${{ env.ARTIFACT_PATH }}/dist"
          echo "✅ Saved to: $HOME/${{ env.ARTIFACT_PATH }}"
          ls -l "$HOME/${{ env.ARTIFACT_PATH }}/dist"

  # ===========================================================================
  # Windows
  # ===========================================================================
  build-windows:
    name: "Build & Test: Windows"
    needs: [validate, request-builders]
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v7

      - name: Check out o3de-cli
        uses: actions/checkout@v7
        with:
          repository: accesspointmg/o3de-cli
          ref: ${{ env.O3DE_CLI_REF }}
          path: .deps/o3de-cli

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        shell: powershell
        run: |
          python -m venv "$env:RUNNER_TEMP\venv"
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip install --upgrade pip
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip install -e .deps/o3de-cli -e "src/gui[dev]"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test
        shell: powershell
        run: |
          $dir = Join-Path $env:USERPROFILE "${{ env.ARTIFACT_PATH }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pytest tests -v --tb=short --junitxml "$dir\pytest-windows.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Write-Output "Saved to: $dir"

  # ===========================================================================
  # Ubuntu
  # ===========================================================================
  build-ubuntu:
    name: "Build & Test: Ubuntu"
    needs: [validate, request-builders]
    runs-on: [self-hosted, ubuntu]
    steps:
      - uses: actions/checkout@v7

      - name: Check out o3de-cli
        uses: actions/checkout@v7
        with:
          repository: accesspointmg/o3de-cli
          ref: ${{ env.O3DE_CLI_REF }}
          path: .deps/o3de-cli

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e .deps/o3de-cli -e "src/gui[dev]"

      - name: Test
        run: |
          mkdir -p "$HOME/${{ env.ARTIFACT_PATH }}"
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests -v --tb=short \
            --junitxml "$HOME/${{ env.ARTIFACT_PATH }}/pytest-ubuntu.xml"
          echo "✅ Saved to: $HOME/${{ env.ARTIFACT_PATH }}"

  # ===========================================================================
  # Fedora (actions/setup-python has no Fedora builds: use the system Python)
  # ===========================================================================
  build-fedora:
    name: "Build & Test: Fedora"
    needs: [validate, request-builders]
    runs-on: [self-hosted, fedora]
    steps:
      - uses: actions/checkout@v7

      - name: Check out o3de-cli
        uses: actions/checkout@v7
        with:
          repository: accesspointmg/o3de-cli
          ref: ${{ env.O3DE_CLI_REF }}
          path: .deps/o3de-cli

      - name: Install
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e .deps/o3de-cli -e "src/gui[dev]"

      - name: Test
        run: |
          mkdir -p "$HOME/${{ env.ARTIFACT_PATH }}"
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests -v --tb=short \
            --junitxml "$HOME/${{ env.ARTIFACT_PATH }}/pytest-fedora.xml"
          echo "✅ Saved to: $HOME/${{ env.ARTIFACT_PATH }}"

  # ===========================================================================
  # RELEASE BUILDERS (Mark as available, VMs stay running)
  # ===========================================================================

  release-builders:
    name: "Release Builders"
    runs-on: [self-hosted, coordinator]
    needs: [request-builders, build-windows, build-ubuntu, build-fedora]
    if: always()
    steps:
      - name: Release Windows builder
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py release windows
        continue-on-error: true

      - name: Release Ubuntu builder
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py release ubuntu
        continue-on-error: true

      - name: Release Fedora builder
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py release fedora
        continue-on-error: true

      - name: Final status
        run: |
          cd ~/coordinator
          source venv/bin/activate
          python coordinator.py status
          echo ""
          echo "✅ Builders released (VMs stay running for reuse)"

  # ===========================================================================
  # VERIFICATION COMPLETE
  # ===========================================================================

  verify-complete:
    name: "✓ Verification Complete"
    needs: [validate, build-macos, build-windows, build-ubuntu, build-fedora, release-builders]
    runs-on: [self-hosted, macOS]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Verify Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.validate.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | ${{ needs.build-macos.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.build-windows.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu | ${{ needs.build-ubuntu.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fedora | ${{ needs.build-fedora.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Builder Release | ${{ needs.release-builders.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any platform failed
        if: needs.build-macos.result != 'success' || needs.build-windows.result != 'success' || needs.build-ubuntu.result != 'success' || needs.build-fedora.result != 'success'
        run: exit 1
