# =============================================================================
# VERIFY WORKFLOW
# =============================================================================
# o3de-pilot is a pure-Python (PySide6) app. This workflow:
#   gate → lint → package (wheel + sdist, built once) → test the built wheel
#   on Windows, Ubuntu, Fedora and macOS → summary
#
# Runners:
#   - Windows/Linux: a fresh, throwaway VM per job from the build-farm
#     coordinator (GARM + Proxmox). `runs-on:` names the image. The VM is
#     isolated (internet only, no access to our network) and deleted after the
#     job, so outputs go to GitHub artifacts.
#   - macOS: GitHub-hosted `macos-latest` until our own macOS VMs exist.
#   - gate / summary: GitHub-hosted `ubuntu-latest`.
# Available images: ubuntu24-amd64 ubuntu22-amd64 ubuntu26-amd64 debian13-amd64
#   fedora44-amd64 alma10-amd64 arch-amd64 opensuse-tw-amd64 win11-amd64
#
# o3de-cli (a dependency) is not on PyPI yet, so it is installed from its
# GitHub repo at O3DE_CLI_REF.
# =============================================================================

name: Verify Build

on:
  push:
    branches:
      - '**'  # All branches
    tags-ignore:
      - '**'  # Ignore tags
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole pipeline with the release version stamped in.
  workflow_call:
    inputs:
      version:
        description: 'Version to stamp into the package (empty = keep pyproject.toml)'
        type: string
        default: ''

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  O3DE_CLI_REF: development
  RUFF_VERSION: "0.17.3"

jobs:
  # ===========================================================================
  # GATE: never run fork PRs on self-hosted runners
  # ===========================================================================
  # This repo is public. A pull request from a fork is code from anyone, and
  # the jobs below run on our own machines. Fork PRs stop here. To build
  # one, a maintainer reviews it and pushes it to a branch in this repo.
  #
  # Defense in depth only: a fork PR can edit this file. The real control is the
  # org setting that requires maintainer approval before any outside
  # contributor's workflow runs — never approve a fork PR that changes .github/.
  gate:
    name: "Self-hosted gate"
    runs-on: ubuntu-latest
    steps:
      - name: Refuse fork pull requests
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::Pull requests from forks are not built on self-hosted runners. A maintainer will build this after review."
            exit 1
          fi
          echo "✓ Not a fork pull request"

  # ===========================================================================
  # LINT
  # ===========================================================================
  # Blocking: errors that break at runtime (syntax errors, undefined names).
  # Style (`ruff check` with default rules, `ruff format`) is reported but does
  # not fail the build until the existing findings are cleaned up.
  lint:
    name: "Lint"
    needs: [gate]
    runs-on: ubuntu24-amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: python -m pip install "ruff==${RUFF_VERSION}"

      - name: Errors (blocking)
        run: ruff check --isolated --select E9,F63,F7,F82 --output-format=github src/gui tests

      - name: Style (report only)
        continue-on-error: true
        run: |
          ruff check --isolated --statistics src/gui tests
          ruff format --isolated --check src/gui tests

  # ===========================================================================
  # PACKAGE: build the wheel and sdist once; every OS tests this same wheel
  # ===========================================================================
  package:
    name: "Package"
    needs: [gate]
    runs-on: ubuntu24-amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Stamp release version
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i -E "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" src/gui/pyproject.toml
          grep -n '^version' src/gui/pyproject.toml

      - name: Build wheel and sdist
        run: |
          python -m pip install build twine
          python -m build --outdir dist src/gui
          twine check --strict dist/*

      - name: Check package contents
        run: |
          # Non-Python files the app needs at runtime must be in the wheel.
          python -m zipfile -l dist/*.whl | grep -q 'o3de_pilot_gui/terminal/terminal.html'
          python -m zipfile -l dist/*.whl | grep -q 'o3de_pilot_gui/terminal/xterm.min.js'
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  # ===========================================================================
  # TEST: install the built wheel and run the test suite on each OS
  # ===========================================================================
  # Tests run against the installed wheel, not the source tree, so packaging
  # mistakes (missing files, bad metadata) fail here.
  test:
    name: "Test: ${{ matrix.name }}"
    needs: [package]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, runner: win11-amd64 }
          - { name: Ubuntu,  runner: ubuntu24-amd64 }
          - { name: Fedora,  runner: fedora44-amd64 }
          - { name: macOS,   runner: macos-latest }
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      # Chromium's sandbox needs user namespaces, which CI VMs may not allow.
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Qt runtime libraries (Ubuntu)
        if: matrix.name == 'Ubuntu'
        run: |
          sudo apt-get update
          # What Qt Widgets + WebEngine load on Ubuntu 24.04 (checked with /proc/self/maps).
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libfreetype6 libdbus-1-3 libglib2.0-0t64 libnss3 libnspr4 libasound2t64 \
            libx11-6 libx11-xcb1 libxcb1 libxcb-dri3-0 libxcb-cursor0 libxext6 libxfixes3 \
            libxcomposite1 libxdamage1 libxrandr2 libxrender1 libxtst6 libxi6 libxkbfile1 \
            libxshmfence1 libgbm1 libdrm2 libgssapi-krb5-2

      # Fedora uses its own Python: setup-python ships builds for Ubuntu only.
      - name: Qt runtime libraries and Python (Fedora)
        if: matrix.name == 'Fedora'
        run: |
          sudo dnf install -y \
            python3 mesa-libEGL mesa-libGL libglvnd-opengl libxkbcommon libxkbcommon-x11 \
            fontconfig dbus-libs nss alsa-lib libXcomposite libXdamage libXrandr \
            libXtst libxkbfile libxshmfence mesa-libgbm libXi libXrender xcb-util-cursor
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v7
        if: matrix.name != 'Fedora'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Install o3de-cli and the o3de-pilot wheel
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install "o3de-cli @ git+https://github.com/accesspointmg/o3de-cli@${O3DE_CLI_REF}"
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[dev]"

      - name: Run tests
        run: python -m pytest tests -v --tb=short -p no:cacheprovider

  # ===========================================================================
  # VERIFICATION COMPLETE
  # ===========================================================================
  # The name must stay "Verification Complete": main's branch protection
  # requires a check with exactly that name.
  verify-complete:
    name: "Verification Complete"
    needs: [gate, lint, package, test]
    runs-on: ubuntu-latest
    if: always() && needs.gate.result == 'success'
    steps:
      - name: Check results
        run: |
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; *) echo "❌ ($1)";; esac; }
          {
            echo "## Verify Build Summary"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| Lint | $(icon ${{ needs.lint.result }}) |"
            echo "| Package | $(icon ${{ needs.package.result }}) |"
            echo "| Tests (Windows, Ubuntu, Fedora, macOS) | $(icon ${{ needs.test.result }}) |"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "The wheel and sdist are in this run's Artifacts (python-package, kept 14 days)."
          } >> $GITHUB_STEP_SUMMARY

          for r in "${{ needs.lint.result }}" "${{ needs.package.result }}" "${{ needs.test.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::Verification failed"
              exit 1
            fi
          done
          echo "✅ All checks passed"
