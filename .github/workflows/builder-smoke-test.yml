# Smoke test for every builder image. Lives in o3de-pilot at
# .github/workflows/builder-smoke-test.yml on branch builder-smoke-test (a push to that branch runs it).
# Each job gets a fresh throwaway VM from GARM; checks: image info, tools, internet OK, LAN blocked.
name: Builder smoke test
on:
  push:
    branches: [builder-smoke-test]
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu24-amd64, ubuntu22-amd64, ubuntu26-amd64, debian13-amd64,
                fedora44-amd64, alma10-amd64, arch-amd64, opensuse-tw-amd64]
    runs-on: ${{ matrix.image }}
    steps:
      - name: Where am I
        run: |
          hostname; nproc; free -h; df -h /
          cat /etc/builder-image-info
      - name: Tools
        run: gcc --version | head -1; clang --version | head -1; cmake --version | head -1; git lfs version
      - name: Docker works
        run: docker run --rm hello-world
      - name: Internet works, LAN does not
        run: |
          curl -sS -o /dev/null -w 'github.com API: %{http_code}\n' https://api.github.com
          if timeout 5 bash -c '</dev/tcp/192.168.1.2/8006'; then echo "LAN REACHABLE - BAD"; exit 1; else echo "LAN blocked - good"; fi
      - uses: actions/checkout@v4
      - run: ls -la

  windows:
    runs-on: win11-amd64
    steps:
      - name: Where am I
        shell: powershell
        run: |
          $env:COMPUTERNAME; (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          Get-Content C:\builder-image-info.txt
      - name: Compilers
        shell: cmd
        run: |
          call "C:\BuildTools\2026\VC\Auxiliary\Build\vcvars64.bat" >nul && cl 2>&1 | findstr /C:"Version"
          call "C:\BuildTools\2022\VC\Auxiliary\Build\vcvars64.bat" >nul && cl 2>&1 | findstr /C:"Version"
          cmake --version
          git lfs version
      - name: Internet works, LAN does not
        shell: powershell
        run: |
          (Invoke-WebRequest -UseBasicParsing https://api.github.com).StatusCode
          $c = New-Object Net.Sockets.TcpClient
          if ($c.ConnectAsync('192.168.1.2', 8006).Wait(5000)) { 'LAN REACHABLE - BAD'; exit 1 } else { 'LAN blocked - good' }
      - uses: actions/checkout@v4
      - run: dir
